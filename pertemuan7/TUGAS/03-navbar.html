<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 - Navbar - Sebelum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            background-color: #2c3e50;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .logo {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 8px 12px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #3498db;
        }
    </style>
</head>
<body>
<link rel="stylesheet" href="../../kembali.css">
<!--
    INSTRUKSI PENGERJAAN:
    1. Beri background warna gelap pada <nav>, set padding, dan jadikan Flexbox dengan justify-content: space-between agar logo dan menu terpisah di kiri-kanan.
        2. Hilangkan bullet point (list-style: none) pada <ul> dan jadikan Flexbox agar item menu berjejer horizontal. Beri jarak antar elemen (gap).
            3. Pada logo (.logo), ubah warnanya jadi putih, besarkan font, dan hilangkan garis bawah.
            4. Pada link menu <a>, hilangkan garis bawah, beri warna teks putih cerah, dan padding.
                5. Tambahkan efek hover pada link menu (misal warnanya berubah atau muncul garis bawah buatan).
                -->
                <nav>
                    <a href="#" class="logo">MyWebsite</a>
                    <ul>
                        <li><a href="#">Beranda</a></li>
                        <li><a href="#">Layanan</a></li>
                        <li><a href="#">Tentang</a></li>
                        <li><a href="#">Kontak</a></li>
                    </ul>
                </nav>
                <a href="../../index.html" class="kembali klik" onclick="if (history.length > 1) { history.back(); return false; }">Kembali</a>
</body>
</html>
