<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06 - Footer - Sebelum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 50px 20px 20px;
        }

        .footer-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        .footer-col h3 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .footer-col p {
            color: #bdc3c7;
            line-height: 1.6;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col li {
            margin-bottom: 10px;
        }

        .footer-col a {
            color: #bdc3c7;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-col a:hover {
            color: #3498db;
        }

        .footer-bottom {
            text-align: center;
            border-top: 1px solid #34495e;
            padding-top: 20px;
            color: #95a5a6;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!--
    INSTRUKSI PENGERJAAN:
    1. Beri background gelap pada <footer>, warna teks putih/terang, dan padding yang cukup luas (misal padding: 50px).
    2. Jadikan class ".footer-container" sebagai CSS Grid dengan "grid-template-columns: repeat(4, 1fr)" agar membentuk 4 kolom sejajar, beri gap antar kolom.
    3. Hilangkan bullet pada <ul>, ubah warna link <a> agar kontras (misal abu-abu terang), dan hilangkan garis bawah.
    4. Tambahkan jarak (margin) pada tiap <h3>.
    5. Bagian hak cipta (copyright) diatur di bawah dengan teks ditengah (text-align: center) dan garis atas (border-top).
    -->
    <footer>
        <div class="footer-container">
            <div class="footer-col">
                <h3>Tentang Kami</h3>
                <p>Kami adalah perusahaan yang menyediakan layanan digital terbaik untuk Anda.</p>
            </div>
            <div class="footer-col">
                <h3>Tautan Cepat</h3>
                <ul>
                    <li><a href="#">Beranda</a></li>
                    <li><a href="#">Tentang</a></li>
                    <li><a href="#">Layanan</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h3>Bantuan</h3>
                <ul>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Cara Pesan</a></li>
                    <li><a href="#">Pengembalian</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h3>Sosial Media</h3>
                <ul>
                    <li><a href="#">Facebook</a></li>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">Twitter</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Hak Cipta Dilindungi.</p>
        </div>
    </footer>
</body>
</html>
