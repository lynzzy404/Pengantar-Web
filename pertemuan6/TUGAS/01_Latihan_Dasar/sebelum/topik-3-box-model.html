<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topik 3: Box Model</title>
    <style>
        /* TUGAS 3:
           Pada class 'kotak':
           1. Tambahkan padding 20px
           2. Tambahkan border 5px solid black
           3. Tambahkan margin 15px
           4. Tambahkan box-sizing: border-box agar ukuran total tetap 200px
        */
        .kotak {
            width: 200px;
            background-color: #fca5a5;
            /* Tambahkan kode di bawah ini */
            padding: 20px;
            border: 5px solid black;
            margin: 15px;
            box-sizing: border-box;
            
        }
    </style>
    <link rel="stylesheet" href="../../../../kembali.css">
</head>
<body>
    <a class="kembali klik" href="../../../../index.html" onclick="if (history.length > 1) { history.back(); return false; }">Kembali</a>

    <div class="kotak">Ini adalah Box 2</div>
</body>
</html>
