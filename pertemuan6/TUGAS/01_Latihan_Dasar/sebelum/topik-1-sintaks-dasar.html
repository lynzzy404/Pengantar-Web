<head>

    <title>Topik 1: Sintaks Dasar CSS</title>
    <style>

           Panggil selector 'h1', berikan property 'color' dengan value 'blue' 
           dan 'font-size' sebesar '32px'.

            color: blue;
            font-size: 32px;
        }
