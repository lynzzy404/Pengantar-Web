<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topik 6: Responsif & Media Queries</title>
    <style>
        .konten {
            display: flex;
            flex-direction: row; /* Berdampingan di Desktop */
            gap: 20px;
        }
        .kolom { background: #8b5cf6; color: white; padding: 30px; flex: 1; text-align: center;}
        
        /* TUGAS 6:
           Buat Media Query untuk layar dengan max-width: 768px (Tablet/HP).
           Di dalamnya, ubah .konten menjadi flex-direction: column; agar elemen bertumpuk ke bawah.
        */
        @media (max-width: 768px) {
            .konten {
                flex-direction: column;
            }
        }
        
    </style>
    <link rel="stylesheet" href="../../../../kembali.css">
</head>
<body>
    <a class="kembali klik" href="../../../../index.html" onclick="if (history.length > 1) { history.back(); return false; }">Kembali</a>
    <div class="konten">
        <div class="kolom">Kolom Kiri</div>
        <div class="kolom">Kolom Kanan</div>
    </div>
</body>
</html>
