<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topik 2: Selectors & Warna</title>
    <style>
        /* TUGAS 2:
           1. Targetkan ID 'judul-utama' dan beri warna teks HEX #38BDF8.
           2. Targetkan Class 'tombol' dan beri warna background HEX #2563EB dan warna teks putih.
           3. Berikan efek ':hover' pada class 'tombol' dengan background warna orange.
        */
        
        #judul-utama {
            color: #38bdf8;
        }
        .tombol {
            background-color: #2563EB;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .tombol:hover {
            background-color: orange;
        }
    </style>
    <link rel="stylesheet" href="../../../../kembali.css">
</head>
<body>
    <a class="kembali klik" href="../../../../index.html#pertemuan-6">Kembali</a>
    <h1 id="judul-utama">Belajar CSS Selectors</h1>
    <button class="tombol">Klik Saya</button>
</body>
</html>
