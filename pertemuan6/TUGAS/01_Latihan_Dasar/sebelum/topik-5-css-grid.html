<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topik 5: CSS Grid</title>
    <style>
        /* TUGAS 5:
           Ubah .grid-wadah menjadi CSS Grid.
           Buat menjadi 3 kolom berukuran sama besar (menggunakan 1fr).
           Beri jarak antar kotak (gap) sebesar 16px.
        */
        .grid-wadah {
            background-color: #f1f5f9;
            padding: 20px;
            
            /* Tambahkan CSS Grid di sini */
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* apa fungsi repeat (3, value) ??*/
            gap: 16px;
            
        }
        .grid-item { background: #10b981; color: white; padding: 20px; text-align: center;}
    </style>
    <link rel="stylesheet" href="../../../../kembali.css">
</head>
<body>
    <a class="kembali klik" href="../../../../index.html">Kembali</a>
    <div class="grid-wadah">
        <div class="grid-item">A</div>
        <div class="grid-item">B</div>
        <div class="grid-item">C</div>
        <div class="grid-item">D</div>
        <div class="grid-item">E</div>
        <div class="grid-item">F</div>

    </div>
</body>
</html>
