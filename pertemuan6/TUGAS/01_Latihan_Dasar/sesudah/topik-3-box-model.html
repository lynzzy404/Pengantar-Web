<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Topik 3: Box Model (Selesai)</title>
    <style>
        .kotak {
            width: 200px;
            background-color: #fca5a5;
            
            /* Penyelesaian */
            padding: 20px;
            border: 5px solid black;
            margin: 15px;
            box-sizing: border-box; /* Best Practice! */
        }
    </style>
</head>
<body>
    <div class="kotak">Ini adalah Box 1</div>
    <div class="kotak">Ini adalah Box 2</div>
</body>
</html>
