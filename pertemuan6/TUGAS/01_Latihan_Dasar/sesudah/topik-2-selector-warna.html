<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Topik 2: Selectors & Warna (Selesai)</title>
    <style>
        #judul-utama {
            color: #38BDF8; /* Hex Color */
        }
        
        .tombol {
            background-color: #2563EB;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        
        .tombol:hover {
            background-color: orange;
        }
    </style>
</head>
<body>
    <h1 id="judul-utama">Belajar CSS Selectors</h1>
    <button class="tombol">Klik Saya</button>
</body>
</html>
