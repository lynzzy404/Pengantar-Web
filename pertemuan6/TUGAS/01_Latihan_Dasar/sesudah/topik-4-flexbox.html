<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Topik 4: Flexbox (Selesai)</title>
    <style>
        .wadah {
            height: 200px;
            background-color: #e2e8f0;
            
            /* Penyelesaian */
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .item { width: 50px; height: 50px; background: #3b82f6; color: white; text-align: center; line-height: 50px;}
    </style>
</head>
<body>
    <div class="wadah">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
</body>
</html>
