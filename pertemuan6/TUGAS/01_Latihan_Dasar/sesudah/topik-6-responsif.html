<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topik 6: Responsif & Media Queries (Selesai)</title>
    <style>
        .konten {
            display: flex;
            flex-direction: row; /* Berdampingan di Desktop */
            gap: 20px;
        }
        .kolom { background: #8b5cf6; color: white; padding: 30px; flex: 1; text-align: center;}
        
        /* Penyelesaian: Media Query */
        @media screen and (max-width: 768px) {
            .konten {
                flex-direction: column; /* Bertumpuk di Mobile */
            }
        }
    </style>
</head>
<body>
    <div class="konten">
        <div class="kolom">Kolom Kiri</div>
        <div class="kolom">Kolom Kanan</div>
    </div>
</body>
</html>
