<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus 2: Merakit Navbar Web</title>
    <style>
        /* TUGAS:
           1. Buat .navbar-container sejajar horizontal dengan Flexbox (pisahkan ujung ke ujung).
           2. Buat .menu-list sejajar horizontal, hilangkan titik list, beri gap 20px.
        */
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background-color: white;}

        .navbar-container {
            background-color: #1a202c;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .menu-list {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .menu-list li {
            cursor: pointer;
            color: #9CA3AF;
        }
        
        .menu-list li:hover {
            color: white;
        }
    </style>
    <link rel="stylesheet" href="../../../../kembali.css">
</head>
<body>
    <a class="kembali klik" href="../../../../index.html">Kembali</a>
    <nav class="navbar-container">
        <div class="logo">
            <strong>🛡️ BRANDLOGO</strong>
        </div>
        <ul class="menu-list">
            <li>Beranda</li>
            <li>Tentang</li>
            <li>Layanan</li>
            <li>Kontak</li>
        </ul>
    </nav>
</body>
</html>
