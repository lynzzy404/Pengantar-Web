<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus 1: Profil Card Sederhana</title>
    <style>
        /* TUGAS:
           1. Berikan kontener lebar 300px, padding 24px, border-radius 12px, dan box-shadow.
           2. Buat avatar menjadi bulat dengan border-radius 50%.
           3. Ganti warna background tombol, hapus border, dan tambahkan efek hover (transform/cursor).
        */
        
        .kontener {
            width: 300px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0, 0.1);
            text-align: center;
            background-color: white;

        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        button {
            background-color: blue;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: blue;
            cursor: pointer;
            transform: translateY(-2px);
            transition: all 0.2s ease;
        }
    </style>
    <link rel="stylesheet" href="../../../../kembali.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 50px;">
    <div class="kontener" >
        <img src="./profile.webp" alt="Avatar" class="avatar">
        <h2>M. Nur Said</h2>
        <p>Frontend Developer | Tech Educator</p>
        <p>Passionate about clean code and modern UI/UX.</p>
        <button>Follow Said</button>
        <br>
        <br>
        <a class="kembali klik" href="../../../../index.html#pertemuan-6">Kembali</a>
    </div>
</body>
</html>
